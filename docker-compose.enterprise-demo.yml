# 企业授权 Demo 外围基础设施；FenixAgent 应用仍在宿主机使用 `bun run dev` 启动。
# Usage:
#   Copy-Item .env.enterprise-demo.example .env.enterprise-demo
#   docker compose --env-file .env.enterprise-demo -f docker-compose.enterprise-demo.yml up -d
#
# 此文件不替换或叠加社区版 docker-compose.yml。

name: fenixagent-enterprise-demo

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RCS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RCS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RCS_POSTGRES_DB}
    ports:
      - "${RCS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - enterprise-demo-rcs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [enterprise-demo]

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - enterprise-demo-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [enterprise-demo]

  openfga-postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OPENFGA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OPENFGA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OPENFGA_POSTGRES_DB}
    volumes:
      - enterprise-demo-openfga-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [enterprise-demo]

  openfga-migrate:
    image: openfga/openfga:v1.8.7
    restart: "no"
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://${OPENFGA_POSTGRES_USER}:${OPENFGA_POSTGRES_PASSWORD}@openfga-postgres:5432/${OPENFGA_POSTGRES_DB}?sslmode=disable
    depends_on:
      openfga-postgres:
        condition: service_healthy
    networks: [enterprise-demo]

  openfga:
    image: openfga/openfga:v1.8.7
    restart: unless-stopped
    command: ["run", "--playground-enabled=false"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://${OPENFGA_POSTGRES_USER}:${OPENFGA_POSTGRES_PASSWORD}@openfga-postgres:5432/${OPENFGA_POSTGRES_DB}?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_LOG_LEVEL: info
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "${OPENFGA_HTTP_PORT:-8080}:8080"
      - "${OPENFGA_GRPC_PORT:-8082}:8081"
    networks: [enterprise-demo]

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - enterprise-demo-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [enterprise-demo]

networks:
  enterprise-demo:
    name: fenixagent-enterprise-demo
    driver: bridge

volumes:
  enterprise-demo-rcs-postgres:
  enterprise-demo-redis:
  enterprise-demo-openfga-postgres:
  enterprise-demo-minio:
